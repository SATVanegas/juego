<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Burocracia S.A.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: oficina pública — papel de seguridad verdoso, tinta de sello azul, rojo de infracción.
   Proyector = tablero de ventanilla a pantalla completa; celulares = formatos oficiales apilados. */
:root{
  --paper:#EDF1EA; --panel:#FFFFFF; --panel-2:#F4F7F1; --ink:#17202A; --muted:#55645E; --rule:#CAD3C7;
  --seal:#28368F; --seal-soft:#DFE4F7; --stamp:#B42029; --stamp-soft:#F8DCDE;
  --ok:#1C7246; --ok-soft:#D8EEE0; --warn:#8F5500; --warn-soft:#F6E6C8;
  --o1:#2a78d6; --o2:#eb6834; --o3:#1baf7a; --o4:#eda100; --o5:#e87ba4;
  --shadow:0 1px 0 rgba(23,32,42,.06), 0 6px 18px -10px rgba(23,32,42,.25);
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1417; --panel:#182027; --panel-2:#1D262E; --ink:#E5EAE3; --muted:#95A39C; --rule:#2C3841;
  --seal:#9AA8FF; --seal-soft:#252D55; --stamp:#FF6B6B; --stamp-soft:#4A1D22;
  --ok:#52C98D; --ok-soft:#163829; --warn:#F0B347; --warn-soft:#3D2E12;
  --o1:#3987e5; --o2:#d95926; --o3:#199e70; --o4:#c98500; --o5:#d55181;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0F1417; --panel:#182027; --panel-2:#1D262E; --ink:#E5EAE3; --muted:#95A39C; --rule:#2C3841;
  --seal:#9AA8FF; --seal-soft:#252D55; --stamp:#FF6B6B; --stamp-soft:#4A1D22;
  --ok:#52C98D; --ok-soft:#163829; --warn:#F0B347; --warn-soft:#3D2E12;
  --o1:#3987e5; --o2:#d95926; --o3:#199e70; --o4:#c98500; --o5:#d55181;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  background-image:
    repeating-linear-gradient(135deg, color-mix(in srgb, var(--seal) 5%, transparent) 0 1px, transparent 1px 10px),
    repeating-linear-gradient(45deg, color-mix(in srgb, var(--seal) 3%, transparent) 0 1px, transparent 1px 14px);
}
h1,h2,h3{font-family:var(--f-display); font-weight:800; letter-spacing:.01em; line-height:1.05; text-wrap:balance; margin:0}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--seal); outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.label{font-size:11px; text-transform:uppercase; letter-spacing:.12em; font-weight:700; color:var(--muted)}

/* Top bar */
.topbar{display:flex; align-items:center; gap:12px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); border-bottom:1px solid var(--rule); background:color-mix(in srgb, var(--panel) 85%, transparent); position:sticky; top:env(safe-area-inset-top,0px); z-index:20; backdrop-filter:blur(6px)}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand svg{width:34px; height:34px; flex:none}
.brand b{font-family:var(--f-display); font-size:22px; font-weight:900; letter-spacing:.02em; line-height:1}
.brand small{display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
.topbar .spacer{flex:1}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--rule); background:var(--panel); white-space:nowrap}
.chip .dot{width:8px; height:8px; border-radius:50%; background:currentColor}
.chip.live{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent)}
.chip.local{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent)}
.chip.err{color:var(--stamp)}
body[data-role="proj"] .topbar{display:none}

#view{padding-block:20px 60px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
body[data-role="proj"] #view{padding:0}

/* Buttons */
.btn{appearance:none; border:1px solid var(--rule); background:var(--panel); color:var(--ink); padding:9px 14px; border-radius:var(--r); font-weight:700; cursor:pointer; line-height:1.2; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center}
.btn:hover{border-color:var(--seal)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--seal); border-color:var(--seal); color:var(--panel)}
.btn.danger{background:var(--stamp); border-color:var(--stamp); color:var(--panel)}
.btn.ok{background:var(--ok); border-color:var(--ok); color:var(--panel)}
.btn.ghost{background:transparent}
.btn.big{padding:14px 18px; font-size:17px; width:100%}
.btn.sm{padding:5px 9px; font-size:13px}
.btn.on{outline:2px solid var(--seal); outline-offset:1px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.stack{display:grid; gap:12px}
.card{background:var(--panel); border:1px solid var(--rule); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); min-width:0}
.card > h3{font-size:22px; margin-bottom:10px}
.card .sub{font-size:13px; color:var(--muted); margin-top:-6px; margin-bottom:12px}

/* Home */
.home{max-width:1080px; margin:0 auto; display:grid; gap:28px}
.hero{display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:center}
.hero svg{width:132px; height:132px}
.hero h1{font-size:clamp(46px, 8vw, 88px); font-weight:900; text-transform:uppercase; letter-spacing:-.005em}
.hero .lede{max-width:62ch; font-size:17px; margin-top:8px}
.levels{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:0; border:1px solid var(--rule); border-radius:var(--r); background:var(--panel); overflow:hidden}
.levels > div{padding:14px 16px; border-left:1px solid var(--rule); min-width:0}
.levels > div:first-child{border-left:0}
.levels b{font-family:var(--f-display); font-size:24px; display:block; line-height:1.1}
.levels .pts{font-family:var(--f-mono); font-size:13px; color:var(--seal); font-weight:600}
.roles{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px}
.role{display:flex; flex-direction:column; gap:10px}
.role h3{font-size:26px}
.role p{font-size:14px; color:var(--muted); flex:1}
.office-picks{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.office-picks .btn{padding:8px 0; border-width:2px}
.note{font-size:13px; color:var(--muted); max-width:70ch}
.swatch{display:inline-block; width:12px; height:12px; border-radius:3px; flex:none}

/* Phone views */
.phone{max-width:560px; margin:0 auto; display:grid; gap:14px}
.phead{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:end; padding:14px 16px; background:var(--panel); border:1px solid var(--rule); border-radius:var(--r); border-top:6px solid var(--oc, var(--seal)); box-shadow:var(--shadow)}
.phead .who{font-family:var(--f-display); font-size:26px; font-weight:800; line-height:1.05}
.phead .office{font-size:13px; color:var(--muted); font-weight:600}
.phead .clock{font-family:var(--f-display); font-size:40px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; text-align:right}
.phead .rlabel{font-size:12px; font-weight:700; color:var(--seal); text-align:right; letter-spacing:.06em; text-transform:uppercase}
.banner{border:1px dashed var(--seal); background:var(--seal-soft); padding:10px 12px; border-radius:var(--r); font-size:14px}
.banner b{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em}
.secret{border:2px solid var(--ink); background:var(--panel); padding:12px 14px; border-radius:var(--r); position:relative}
.secret .label{color:var(--ink)}
.waiting{text-align:center; padding:28px 16px}
.waiting h2{font-size:34px; margin-bottom:8px}

/* Formatos oficiales */
.formato{background:var(--panel); border:1.5px solid var(--ink); border-radius:2px; box-shadow:var(--shadow); min-width:0}
.formato-head{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; padding:10px 12px; border-bottom:1.5px solid var(--ink)}
.formato-head .code{font-family:var(--f-mono); font-weight:600; font-size:15px; border:1.5px solid var(--ink); padding:4px 8px; letter-spacing:.04em; white-space:nowrap}
.formato-head b{display:block; font-size:15px; line-height:1.25}
.formato-head small{display:block; font-size:12px; color:var(--muted)}
.formato .rad{grid-column:1/-1; font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.formato .rad b{display:inline; font-size:12px; color:var(--ink)}
.formato fieldset{border:0; margin:0; padding:12px; display:grid; gap:12px; min-width:0}
.field{display:grid; gap:4px}
.field label{font-size:13px; font-weight:700}
.field .hint{font-size:12px; color:var(--muted)}
.field input,.field select,.field textarea{width:100%; border:0; border-bottom:1.5px solid var(--ink); background:var(--panel-2); padding:9px 10px; border-radius:2px 2px 0 0; font-family:var(--f-mono); font-size:15px}
.field textarea{min-height:70px; resize:vertical; font-family:var(--f-body)}
.check{display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:start; font-size:14px; cursor:pointer}
.check input{width:20px; height:20px; margin:1px 0 0; accent-color:var(--seal)}
.errs:empty{display:none}
.errs{border-left:4px solid var(--stamp); background:var(--stamp-soft); padding:10px 12px; font-size:13px; display:grid; gap:6px}
.errs b{color:var(--stamp)}
.quote{font-family:var(--f-mono); font-size:14px; background:var(--panel-2); border:1px dashed var(--muted); padding:10px; user-select:none; -webkit-user-select:none}
.dl{display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; font-size:13px; padding:10px 12px}
.dl dt{color:var(--muted)}
.dl dd{margin:0; font-family:var(--f-mono); min-width:0; overflow-wrap:anywhere}
.steps{display:flex; gap:4px; padding:0 12px 0; margin-top:10px}
.steps span{flex:1; height:5px; background:var(--rule); border-radius:3px}
.steps span.done{background:var(--seal)}
.tapzone{display:grid; gap:12px; text-align:center}
.tap{appearance:none; border:0; border-radius:50%; width:min(70vw, 260px); aspect-ratio:1; max-width:100%; margin:8px auto; background:var(--oc, var(--seal)); color:#fff; font-family:var(--f-display); font-size:34px; font-weight:900; line-height:1; cursor:pointer; box-shadow:0 10px 0 color-mix(in srgb, var(--oc, var(--seal)) 60%, #000), var(--shadow); text-transform:uppercase; text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tap:active{transform:translateY(6px); box-shadow:0 4px 0 color-mix(in srgb, var(--oc, var(--seal)) 60%, #000)}
.tap:disabled{filter:grayscale(.8); opacity:.5}
.bigcount{font-family:var(--f-display); font-size:64px; font-weight:900; line-height:1}

/* Status chips */
.st{display:inline-flex; padding:2px 8px; border-radius:3px; font-size:12px; font-weight:700; border:1px solid currentColor; white-space:nowrap}
.st.wait{color:var(--warn); background:var(--warn-soft)}
.st.ok{color:var(--ok); background:var(--ok-soft)}
.st.bad{color:var(--stamp); background:var(--stamp-soft)}
.st.info{color:var(--seal); background:var(--seal-soft)}
.tlist{display:grid; gap:8px}
.titem{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; padding:10px 12px; background:var(--panel); border:1px solid var(--rule); border-radius:var(--r); min-width:0}
.titem .rad{font-family:var(--f-mono); font-size:13px; font-weight:600}
.titem .meta{grid-column:1/-1; font-size:12px; color:var(--muted)}
.sect-title{font-family:var(--f-display); font-size:22px; font-weight:800; margin:6px 0 2px}

/* Moderator */
.mod{max-width:1280px; margin:0 auto; display:grid; gap:16px}
.mod-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px}
.rtabs{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:6px}
.rtabs .btn{flex-direction:column; gap:0; padding:8px 4px}
.rtabs .btn small{font-weight:600; font-size:11px; opacity:.8}
.rtabs .btn.cur{background:var(--seal); color:var(--panel); border-color:var(--seal)}
.mclock{font-family:var(--f-display); font-size:64px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1}
.round-ctl{display:grid; grid-template-columns:auto 1fr; gap:16px 22px; align-items:center; margin-top:14px}
.tbl-wrap{overflow-x:auto}
table.score{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px}
table.score th{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); text-align:right; padding:6px 8px; border-bottom:1.5px solid var(--ink); white-space:nowrap}
table.score th:first-child, table.score td:first-child{text-align:left}
table.score td{padding:8px; border-bottom:1px solid var(--rule); text-align:right; white-space:nowrap}
table.score td.total{font-family:var(--f-display); font-size:22px; font-weight:900}
.oname{display:flex; align-items:center; gap:8px; font-weight:700; white-space:normal; min-width:160px}
.pen-grid{display:grid; gap:8px}
.pen-row{display:grid; grid-template-columns:minmax(0,1fr) repeat(4, minmax(0,1fr)); gap:6px; align-items:center}
.pen-row .oname{min-width:0; font-size:13px}
.pen-row .btn{font-size:12px; padding:7px 4px; border-color:color-mix(in srgb, var(--stamp) 45%, var(--rule)); color:var(--stamp); background:var(--panel)}
.pen-row .btn:hover{background:var(--stamp-soft)}
.pen-head{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.circ-presets{display:grid; gap:8px}
.circ-btn{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; text-align:left; justify-content:stretch; align-items:start}
.circ-btn .code{font-family:var(--f-mono); grid-row:span 2}
.circ-btn small{font-weight:500; color:var(--muted); font-size:12px}
.qrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--rule)}
.qopts{display:flex; gap:4px}
.qopts .btn{width:36px; padding:6px 0}
.qopts .btn.sel{background:var(--seal); color:var(--panel)}
.office-filter{display:flex; gap:6px; flex-wrap:wrap}
.office-filter .btn{border-width:2px}
.confirm-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--stamp-soft); border:1px solid var(--stamp); padding:10px; border-radius:var(--r)}

/* Maintenance overlay (phones) */
#maint{position:fixed; inset:0; z-index:60; background:color-mix(in srgb, var(--paper) 94%, transparent); display:grid; place-items:center; text-align:center; padding:24px max(16px, env(safe-area-inset-left,0px))}
#maint .box{max-width:420px; display:grid; gap:12px; justify-items:center}
#maint h2{font-size:40px}
.spinner{width:56px; height:56px; border-radius:50%; border:6px solid var(--rule); border-top-color:var(--seal); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toasts */
#toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:90; display:grid; gap:8px; width:min(520px, calc(100% - 32px))}
.toast{background:var(--ink); color:var(--paper); padding:10px 14px; border-radius:var(--r); font-size:14px; box-shadow:var(--shadow); animation:tin .25s ease-out}
.toast.bad{background:var(--stamp); color:#fff}
.toast.ok{background:var(--ok); color:#fff}
@keyframes tin{from{opacity:0; transform:translateY(8px)}}

/* ===== Projector ===== */
.proj{min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; position:relative}
.p-head{display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center; padding:18px max(28px, env(safe-area-inset-left,0px)) 14px; border-bottom:2px solid var(--ink); background:var(--panel)}
.p-brand{display:flex; gap:14px; align-items:center}
.p-brand svg{width:64px; height:64px}
.p-brand b{font-family:var(--f-display); font-size:38px; font-weight:900; line-height:.95; display:block; text-transform:uppercase}
.p-brand small{font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; color:var(--muted)}
.p-round{text-align:center}
.p-round .lvl{font-family:var(--f-mono); font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--seal); font-weight:600}
.p-round .name{font-family:var(--f-display); font-size:clamp(28px, 3.4vw, 52px); font-weight:900; line-height:1}
.p-timer{font-family:var(--f-display); font-weight:900; font-size:clamp(64px, 9vw, 150px); line-height:.85; font-variant-numeric:tabular-nums; text-align:right; min-width:3.2ch}
.p-timer.low{color:var(--stamp)}
.p-timer small{display:block; font-size:14px; font-family:var(--f-body); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); line-height:1.3}
.p-body{padding:22px max(28px, env(safe-area-inset-left,0px)); min-height:0}
.board{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:22px; height:100%}
.lb{display:grid; gap:10px; align-content:start}
.lb-row{display:grid; grid-template-columns:52px minmax(0,1fr) 120px 120px; gap:16px; align-items:center; padding:12px 18px; background:var(--panel); border:1px solid var(--rule); border-left:10px solid var(--oc); border-radius:var(--r); box-shadow:var(--shadow); transition:transform .4s}
.lb-row .rank{font-family:var(--f-display); font-size:44px; font-weight:900; color:var(--muted); line-height:1}
.lb-row.lead .rank{color:var(--ink)}
.lb-row .nm{font-weight:800; font-size:clamp(16px, 1.6vw, 24px); line-height:1.15}
.lb-row .nm small{display:block; font-weight:600; font-size:13px; color:var(--muted)}
.lb-row .num{text-align:right}
.lb-row .num b{font-family:var(--f-display); font-size:clamp(34px, 3.6vw, 58px); font-weight:900; line-height:.9; font-variant-numeric:tabular-nums; display:block}
.lb-row .num small{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:700}
.lb-row .bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.25); color:var(--ok)}}
.side{display:grid; gap:16px; align-content:start}
.rulecard{border:2px solid var(--ink); background:var(--panel); padding:16px 18px; border-radius:2px}
.rulecard p{font-size:clamp(15px, 1.35vw, 20px); line-height:1.4}
.turno{display:grid; grid-template-columns:1fr auto; align-items:center; background:var(--ink); color:var(--paper); padding:14px 18px; border-radius:var(--r)}
.turno b{font-family:var(--f-display); font-size:72px; font-weight:900; line-height:.9; font-variant-numeric:tabular-nums}
.feed{display:grid; gap:6px}
.feed div{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:baseline; background:var(--panel); border:1px solid var(--rule); padding:8px 12px; border-radius:var(--r); font-size:15px; animation:tin .3s}
.feed .mono{font-size:13px; font-weight:600}
.p-ticker{background:var(--seal); color:var(--panel); padding:10px max(28px, env(safe-area-inset-left,0px)); font-size:18px; font-weight:600; display:flex; gap:14px; align-items:center}
.p-ticker b{font-family:var(--f-mono); white-space:nowrap}
.p-ticker.maint{background:var(--warn); color:#111}

/* ---------- almacenamiento (db compartida o local) ---------- */
const store = (() => {
  let db = null, mode = 'connecting', canWrite = null;
  const local = {}, listeners = {}, chains = {};
  const key = p => 'bsa:' + p;
  const load = p => { if (!local[p]) { let v = {}; try { v = JSON.parse(lsGet(key(p)) || '{}') || {}; } catch (e) {} local[p] = v; } return local[p]; };
  const save = p => lsSet(key(p), JSON.stringify(local[p]));
  const emit = p => { const arr = Object.entries(load(p)).map(([id, d]) => ({ id, ...d })); (listeners[p] || []).forEach(cb => cb(arr)); };
  window.addEventListener('storage', e => { if (!e.key || !e.key.startsWith('bsa:')) return; const p = e.key.slice(4); if (listeners[p]) { delete local[p]; emit(p); } });
  const serial = (k, fn) => { const c = (chains[k] || Promise.resolve()).catch(() => {}).then(fn); chains[k] = c; return c; };
  const merge = (a, b) => { const o = { ...a }; for (const k in b) { const v = b[k]; o[k] = (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) ? merge(a[k], v) : v; } return o; };
  const clone = d => JSON.parse(JSON.stringify(d));
  return {
    get mode(){ return mode; }, get canWrite(){ return canWrite; },
    async init(){
      if (lsGet('bsa-pref-local') === '1' || !window.claude || !window.claude.use) { mode = 'local'; return; }
      try { db = await window.claude.use('db'); } catch (e) { db = null; }
      if (!db) { mode = 'local'; return; }
      mode = 'live';
      try { const user = await window.claude.use('user'); if (user) canWrite = await user.can('data.write'); } catch (e) {}
    },
    watch(path, cb){
      if (mode === 'live') return db.collection(path).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => onStoreError(e));
      (listeners[path] ||= new Set()).add(cb); setTimeout(() => emit(path), 0);
      return () => listeners[path].delete(cb);
    },
    set(path, id, data){ return serial(path + '/' + id, async () => { if (mode === 'live') return db.collection(path).doc(id).set(data); load(path)[id] = clone(data); save(path); emit(path); }); },
    update(path, id, patch){ return serial(path + '/' + id, async () => { if (mode === 'live') return db.collection(path).doc(id).update(patch); const c = load(path); if (!c[id]) throw { code: 'invalid_argument', message: 'missing' }; c[id] = merge(c[id], clone(patch)); save(path); emit(path); }); },
    del(path, id){ return serial(path + '/' + id, async () => { if (mode === 'live') return db.collection(path).doc(id).delete(); delete load(path)[id]; save(path); emit(path); }); },
  };
})();
let storeErrShown = false;
function onStoreError(e){
  if (storeErrShown) return; storeErrShown = true;
  const chip = $('#modechip'); chip.className = 'chip err'; chip.innerHTML = '<span class="dot"></span>Sin conexión';
  toast(e && e.code === 'revoked' ? 'Este dispositivo perdió el acceso al juego. Recargue la página.' : 'Se perdió la conexión con el juego. Recargue la página o use el modo local desde el panel del moderador.', 'bad');
}
function errMsg(e){
  const c = e && e.code;
  if (c === 'invalid_argument') return 'No se pudo guardar: esta cuenta no puede escribir en el juego. El dueño debe invitarla como Editor.';
  if (c === 'resource_exhausted') return 'Demasiadas acciones seguidas. Espere un segundo e intente de nuevo.';
  if (c === 'quota_exceeded') return 'Se llenó el espacio del juego. Reinicie la partida desde el panel del moderador.';

  return 'No se pudo guardar. Revise la conexión e intente de nuevo.';
}

function durOf(m, r){ return (m && m.durs && m.durs[r]) || (ROUNDS[r].dur || 0) * 1000; }
function clock(m = S.main){
  if (!m) return { rem: 0, dur: 0, running: false, elapsed: 0, idle: true, done: false };
  const dur = m.durMs || durOf(m, m.round);
  const rem = m.status === 'running' ? Math.max(0, (m.endsAt || 0) - now()) : (m.remMs ?? dur);
  return { rem, dur, running: m.status === 'running' && rem > 0, elapsed: Math.max(0, dur - rem), idle: m.status === 'idle', done: rem <= 0 && !!ROUNDS[m.round].dur };
}
const turnoActual = () => 1 + Math.floor(clock().elapsed / TURNO_MS);
const bonus = ms => Math.max(0, Math.round(5 * (1 - (ms || 0) / QUIZ_MS)));
const radLabel = t => `R${t.round}-O${t.office + 1}-${t.round === 3 ? toRoman(t.seq || 1) : pad(t.seq || 1)}`;
function formsOf(t){ if (t.kind !== 'form') return 0; return (t.round === 2 ? 1 : 3) + (t.jefeAt ? 1 : 0) + (t.dirAt ? 1 : 0); }

function agg(D){
  const m = D.main || {};
  const rows = [];
  for (let o = 0; o < N_OF; o++){
    const row = { o, r: {}, pen: 0, quiz: 0, quizOk: 0 };
    for (const r of [1, 2, 3]){
      const ts = D.tramites.filter(t => t.office === o && t.round === r);
      const adj = D.aj.filter(a => a.office === o && a.round === r).reduce((s, a) => s + (a.delta || 0), 0);
      const ok = Math.max(0, ts.filter(t => t.status === 'aprobado').length + adj);
      const endAt = (m.roundEndAt && m.roundEndAt[r]) || (m.round === r && m.status === 'running' ? Math.min(now(), m.endsAt || now()) : now());
      const forms = ts.reduce((s, t) => s + formsOf(t), 0);
      const bad = ts.filter(t => ['devuelto','rechazado','anulado'].includes(t.status)).length;
      const queueMs = ts.filter(t => t.kind === 'form').reduce((s, t) => s + Math.max(0, Math.min(t.doneAt || endAt, endAt) - t.createdAt), 0);
      const qc = r === 1 && Array.isArray(m.qc) && m.qc[o] != null && m.qc[o] !== '' ? Number(m.qc[o]) : null;
      row.r[r] = { ok, forms, bad, queueMs, valid: qc != null ? Math.min(qc, ok) : ok, total: ts.length };
    }
    row.pen = D.pen.filter(p => p.office === o).length;
    for (const a of D.ans.filter(a => a.office === o)){ const Q = QUIZ[a.q]; if (Q && a.opt === Q.ok){ row.quizOk++; row.quiz += 10 + bonus(a.ms); } }
    row.pts = row.r[1].ok * 1 + row.r[2].ok * 3 + row.r[3].ok * 3 - row.pen + row.quiz;
    rows.push(row);
  }
  const qcGiven = Array.isArray(m.qc) && m.qc.some(v => v != null && v !== '');
  return { rows, qcGiven, m };
}

function baseMain(sid, prev){
  return { sid, round: 0, status: 'idle', endsAt: 0, remMs: 0, durMs: 0, durs: {}, roundEndAt: {}, maintUntil: 0, circular: null, c004: false,
    quiz: { i: 0, openedAt: 0, reveal: false }, names: (prev && prev.names) || DEFAULT_NAMES, qrLink: (prev && prev.qrLink) || '', burocrata: '', qc: null, reportNonce: 0, createdAt: now() };
}
const M = {
  create: () => store.set('game', 'main', baseMain('s' + uid(), S.main)),
  up: patch => store.update('game', 'main', patch),
  go(r){
    const m = S.main, patch = { round: r, status: 'idle', endsAt: 0, maintUntil: 0 };
    const d = ROUNDS[r].dur ? durOf(m, r) : 0; patch.durMs = d; patch.remMs = d;
    if ([1,2,3].includes(m.round) && m.status !== 'idle' && !(m.roundEndAt && m.roundEndAt[m.round])) patch.roundEndAt = { [m.round]: m.status === 'running' ? Math.min(now(), m.endsAt) : now() };
    if (r === 4) patch.quiz = { i: 0, openedAt: 0, reveal: false };
    if (r === 5) patch.reportNonce = now();
    if (r !== 3) patch.c004 = false;
    return M.up(patch);
  },
  start(){ const c = clock(); if (c.rem <= 0) return Promise.resolve(); return M.up({ status: 'running', endsAt: now() + c.rem }); },
  pause(){ return M.up({ status: 'paused', remMs: clock().rem }); },
  addMin(){ const m = S.main, c = clock(), nd = (m.durMs || c.dur) + 60000;
    return m.status === 'running' ? M.up({ endsAt: Math.max(now(), m.endsAt) + 60000, durMs: nd, durs: { [m.round]: nd } })
                                  : M.up({ remMs: c.rem + 60000, durMs: nd, durs: { [m.round]: nd }, status: m.status === 'idle' ? 'idle' : 'paused' }); },
  finish(){ return M.up({ status: 'paused', remMs: 0, roundEndAt: { [S.main.round]: now() } }); },
  async circular(c){
    const patch = { circular: { code: c.code, tipo: c.tipo, firma: c.firma, text: c.text, at: now() } };
    if (c.special === 'c004') patch.c004 = true;
    await M.up(patch);
    if (c.special === 'c004'){
      const live = S.tramites.filter(t => t.round === 3 && t.kind === 'form' && ['radicado','visto_bueno','visto_direccion'].includes(t.status));
      for (const t of live) await store.update(P.tr(), t.id, { status: 'anulado', causal: 'Circular 004', doneAt: now() });
    }
  },
};

function syncList(box, items, keyOf, html, bind){

  items.forEach((it, i) => {
    const k = want[i]; let el = have.get(k);
    if (!el || !el.isConnected){ const tpl = document.createElement('template'); tpl.innerHTML = html(it).trim(); el = tpl.content.firstElementChild; el.dataset.k = k; bind && bind(el, it); }

}

      : 'Modo local: el juego funciona solo en este navegador. Puede abrir el proyector y el panel del moderador en dos pestañas o ventanas del mismo navegador.';

};

/* ================= DIRECTOR ================= */
VIEWS.dir = root => {

  const mine = r => S.tramites.filter(t => t.office === o && t.round === r && t.kind === 'form');

  function stageKey(){ const m = S.main; if (!m) return 'none' + S.loaded; return [m.sid, m.round, m.round === 3 ? (m.c004 ? 'c' : 'n') + wiz.step : '', m.round === 4 ? m.quiz.i : ''].join('|'); }

  function f01HTML(r){
    const ex = r === 3, c004 = S.main.c004;
    return `<form class="formato" id="f01" novalidate>
      <div class="formato-head"><span class="code">F-01</span><div><b>Solicitud de expedición de pasaporte</b><small>${esc(oName(o))}</small></div><div class="rad">Radicado asignado: <b id="rad-next"></b></div></div>
      ${ex ? '<div class="steps"><span class="done"></span><span></span><span></span><span></span></div>' : ''}
      <fieldset id="d-fs">

        <div class="field"><label for="f-num">Número de pasaporte</label><input id="f-num" name="numero" autocomplete="off" autocapitalize="characters" placeholder="BS204871"><span class="hint">Formato estándar: 2 letras y 6 números.</span></div>
        <div class="field"><label for="f-red">Cargo de quien lo redactó</label><input id="f-red" name="c_red" autocomplete="off" placeholder="Escriba el cargo, no el nombre"></div>

        ${ex ? `<div class="field"><label for="f-rom">Radicado en números romanos</label><span class="hint">Su radicado es el N.º <b id="rom-n" class="mono"></b>. Escríbalo en números romanos.</span><input id="f-rom" name="romano" autocomplete="off" autocapitalize="characters"></div>` : ''}
        ${ex && c004 ? `<div class="field"><label for="f-ref">Referencia normativa vigente</label><span class="hint">Exigida por la última circular del Despacho.</span><input id="f-ref" name="ref" autocomplete="off"></div>` : ''}
        <label class="check"><input type="checkbox" name="std" id="f-std"><span>El pasaporte cumple el formato estándar: nombre, número, foto, sello y firma.</span></label>
        ${ex ? `<label class="check"><input type="checkbox" name="k1" id="f-k1"><span>Leí las instrucciones de este formulario.</span></label>
                <label class="check"><input type="checkbox" name="k2" id="f-k2"><span>Confirmo que leí la casilla anterior.</span></label>
                <label class="check"><input type="checkbox" name="k3" id="f-k3"><span>Confirmo que confirmé la casilla anterior.</span></label>` : ''}
        <div class="field"><label for="f-fir">Firma del Director</label>${ex ? '<span class="hint">En MAYÚSCULAS SOSTENIDAS.</span>' : ''}<input id="f-fir" name="firma" autocomplete="off"></div>
        <div class="errs" id="f-errs"></div>
        <button class="btn primary big" type="submit">${ex ? 'Continuar al F-03' : 'Radicar F-01'}</button>
      </fieldset></form>`;
  }
  function validateF01(fd, r){
    const e = [];
    if (!fd.titular.trim()) e.push('Falta el nombre del titular del pasaporte.');
    if (!/^[A-Z]{2}\d{6}$/.test(fd.numero.trim().toUpperCase())) e.push('El número de pasaporte debe tener 2 letras y 6 números. <b>Rutinas estandarizadas.</b>');
    for (const [k, exp, lbl] of [['c_red','Redactor','redactó'],['c_dib','Dibujante','dibujó'],['c_sel','Sellador','selló']]){
      const v = norm(fd[k]);
      if (v === norm(exp)) continue;
      if (CARGOS.some(c => norm(c) === v)) e.push(`Quien ${lbl} debe ser el ${exp}, no el ${esc(fd[k].trim())}. <b>División del trabajo.</b>`);
      else e.push(`En «quien ${lbl}» escriba el cargo, no el nombre de la persona. <b>Impersonalidad.</b>`);
    }
    if (!fd.std) e.push('Debe certificar que el pasaporte cumple el formato estándar.');
    if (!fd.firma.trim()) e.push('Falta la firma del Director.');
    if (r === 3){
      const seq = nextSeq(3);
      if (fd.romano.trim().toUpperCase() !== toRoman(seq)) e.push(`«${esc(fd.romano.trim() || '(vacío)')}» no es el número ${seq} en números romanos.`);
      if (!/[A-ZÁÉÍÓÚÑ]/.test(fd.firma) || fd.firma !== fd.firma.toUpperCase()) e.push('La firma del Director debe ir en MAYÚSCULAS SOSTENIDAS.');
      if (!fd.k1 || !fd.k2 || !fd.k3) e.push('Debe marcar las tres casillas de confirmación.');
      if (S.main.c004 && norm(fd.ref) !== norm('Circular 004')) e.push('Falta la referencia normativa vigente o no coincide con la última circular.');
      if (wiz.openedAt && now() - wiz.openedAt > F01_EXPIRA) e.push('EXPIRED');
    }
    return e;
  }
  const readForm = f => { const d = {}; for (const el of f.elements){ if (!el.name) continue; d[el.name] = el.type === 'checkbox' ? el.checked : el.value; } return d; };
  const showErrs = (box, errs) => { box.innerHTML = errs.length ? '<b>El Estado no puede radicar este formato:</b>' + errs.map(x => `<div>• ${x}</div>`).join('') : ''; };

  function stageHTML(){
    const m = S.main; if (!m) return '';
    const r = m.round;
    if (r === 0) return `<div class="card"><h3>Sala de espera</h3><p class="sub">Mientras el moderador inicia, repartan los cargos de su oficina.</p>
      <div class="tlist">${CARGOS.map(c => `<div class="titem"><b>${esc(c)}</b></div>`).join('')}</div>
      <p class="muted" style="margin-top:10px; font-size:13px">Asignen cada cargo con una prueba rápida: quien dibuje mejor es el Dibujante. Eso es competencia técnica.</p></div>`;
    if (r === 1) return `<div class="card tapzone"><h3>Nivel 1 · Sin burocracia</h3><p class="sub">No hay formatos, ni jefes, ni revisión. Cada vez que entreguen un pasaporte al Estado, toquen el botón.</p>
      <button class="tap" id="d-tap" type="button">+1<br>Entregado</button>
      <div><span class="label">Entregados por su oficina</span><div class="bigcount" id="d-count">0</div></div>
      <button class="btn ghost sm" id="d-undo" type="button">Anular el último</button></div>`;
    if (r === 2) return f01HTML(2);
    if (r === 3){
      if (wiz.step === 1) return f01HTML(3);
      if (wiz.step === 2) return `<form class="formato" id="f03" novalidate><div class="formato-head"><span class="code">F-03</span><div><b>Certificado de haber diligenciado correctamente el F-01</b><small>${esc(oName(o))}</small></div></div>
        <div class="steps"><span class="done"></span><span class="done"></span><span></span><span></span></div>
        <fieldset id="d-fs">
          <label class="check"><input type="checkbox" name="cert"><span>Certifico que el F-01 fue diligenciado correctamente y sin tachones.</span></label>
          <div class="field"><label for="f3-h">Hora exacta en que diligenció el F-01</label><span class="hint">Formato de 24 horas, HH:MM.</span><input id="f3-h" name="hora" inputmode="numeric" autocomplete="off" placeholder="HH:MM"></div>
          <div class="errs" id="f-errs"></div>
          <button class="btn primary big" type="submit">Continuar al F-27B</button>
          <button class="btn ghost sm" type="button" data-cancel>Cancelar el trámite</button>
        </fieldset></form>`;
      if (wiz.step === 3) return `<form class="formato" id="f27" novalidate><div class="formato-head"><span class="code">F-27B</span><div><b>Declaración juramentada de no uso de nombres propios en horario laboral</b><small>${esc(oName(o))}</small></div></div>
        <div class="steps"><span class="done"></span><span class="done"></span><span class="done"></span><span></span></div>
        <fieldset id="d-fs">
          <div class="field"><label for="f27-t">Transcriba la declaración exactamente como aparece</label><div class="quote">${esc(F27_TEXT)}</div><textarea id="f27-t" name="decl" autocomplete="off" spellcheck="false"></textarea></div>
          <label class="check"><input type="checkbox" name="jura"><span>Lo juro.</span></label>
          <div class="errs" id="f-errs"></div>
          <button class="btn primary big" type="submit">Continuar</button>
          <button class="btn ghost sm" type="button" data-cancel>Cancelar el trámite</button>
        </fieldset></form>`;
      if (wiz.step === 4) return `<div class="formato"><div class="formato-head"><span class="code">ENVÍO</span><div><b>Confirmación de radicación</b><small>F-01 + F-03 + F-27B</small></div></div>
        <div class="steps"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span></div>
        <fieldset id="d-fs"><p id="d-conf-msg">Sus tres formatos están listos para radicar.</p>
          <div class="errs" id="f-errs"></div>
          <button class="btn primary big" id="d-conf" type="button">Radicar trámite</button>
          <button class="btn ghost sm" type="button" data-cancel>Cancelar el trámite</button></fieldset></div>`;
      if (wiz.step === 5) return `<div class="card waiting"><span class="label">Trámite radicado</span><h2 class="mono" style="font-size:28px">${esc(wiz.last ? radLabel(wiz.last) : '')}</h2>
        <p style="font-size:20px">Su turno es el <b class="mono" style="font-size:30px">${wiz.last ? wiz.last.turno : ''}</b></p>
        <p>Turno actual: <b class="mono" data-turno>${turnoActual()}</b></p>
        <p class="muted" style="margin:10px 0 14px">El Jefe de área solo verá su trámite cuando llegue su turno.</p>
        <button class="btn primary" id="d-again" type="button">Radicar otro trámite</button></div>`;
    }
    if (r === 4) return `<div class="card" id="d-quiz"></div>`;
    if (r === 5) return `<div class="card waiting"><h2>Informe del Estado</h2><p>Miren el proyector.</p></div>`;
    return '';
  }

  function bindStage(main){
    const m = S.main; if (!m) return;
    const r = m.round;
    main.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { resetWiz(); update(); });
    if (r === 1){
      $('#d-tap', main).onclick = () => { if (!clock().running) return toast('La ronda no está activa.'); if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
        act(store.set(P.tr(), uid(), { office: o, round: 1, kind: 'tap', status: 'aprobado', createdAt: now(), doneAt: now() })); };
      $('#d-undo', main).onclick = () => { const last = S.tramites.filter(t => t.office === o && t.round === 1 && t.kind === 'tap').sort((a, b) => b.createdAt - a.createdAt)[0]; if (last) act(store.del(P.tr(), last.id), 'Se anuló el último entregado.'); };
    }
    const f01 = $('#f01', main);
    if (f01){
      if (r === 3 && !wiz.openedAt) wiz.openedAt = now();
      f01.onsubmit = async ev => {
        ev.preventDefault();
        if (!clock().running) return toast('La ronda no está activa.');
        const fd = readForm(f01), errs = validateF01(fd, r), box = $('#f-errs', f01);
        if (errs.includes('EXPIRED')){ showErrs(box, ['El formulario expiró por inactividad (máximo 2 minutos y medio). Debe diligenciarlo de nuevo. <b>Exceso de formalismo.</b>']); f01.reset(); wiz.openedAt = now(); return; }
        showErrs(box, errs); if (errs.length) return;
        const f = { titular: fd.titular.trim(), numero: fd.numero.trim().toUpperCase(), c_red: 'Redactor', c_dib: 'Dibujante', c_sel: 'Sellador', firma: fd.firma.trim() };
        if (r === 2){
          const seq = nextSeq(2), t = { office: o, round: 2, kind: 'form', status: 'radicado', seq, f01: f, createdAt: now() };
          if (await act(store.set(P.tr(), uid(), t))){ toast(`Radicado ${radLabel(t)}. Espera visto bueno del Jefe.`, 'ok'); f01.reset(); }
        } else { wiz.f01 = f; wiz.f01At = now(); wiz.step = 2; update(); }
      };
    }
    const f03 = $('#f03', main);
    if (f03) f03.onsubmit = ev => { ev.preventDefault(); const fd = readForm(f03), e = [];
      if (!fd.cert) e.push('Debe certificar el F-01.');
      const mm = /^(\d{1,2}):(\d{2})$/.exec(fd.hora.trim()); const target = new Date(wiz.f01At);
      if (!mm) e.push('La hora debe ir en formato HH:MM.');
      else { const diff = Math.abs((Number(mm[1]) * 60 + Number(mm[2])) - (target.getHours() * 60 + target.getMinutes())); if (diff > 1) e.push('La hora no coincide con el registro del Estado. <b>Carácter formal de las comunicaciones.</b>'); }
      showErrs($('#f-errs', f03), e); if (!e.length){ wiz.step = 3; update(); } };
    const f27 = $('#f27', main);
    if (f27){ const ta = $('textarea', f27); ta.addEventListener('paste', ev => { ev.preventDefault(); toast('El F-27B debe transcribirse a mano. Copiar y pegar no está autorizado.', 'bad'); });
      f27.onsubmit = ev => { ev.preventDefault(); const fd = readForm(f27), e = [];
        if (fd.decl.replace(/\s+/g, ' ').trim() !== F27_TEXT) e.push('La declaración no coincide letra por letra con el texto oficial (mayúsculas, tildes y punto final incluidos). <b>Apego a los reglamentos.</b>');
        if (!fd.jura) e.push('Debe jurar.');
        showErrs($('#f-errs', f27), e); if (!e.length){ wiz.step = 4; wiz.confirm = 0; update(); } }; }
    const conf = $('#d-conf', main);
    if (conf) conf.onclick = async () => {
      if (!clock().running) return toast('La ronda no está activa.');
      const msgs = ['¿Está seguro de que desea radicar?', '¿Completamente seguro? Según el Decreto 27B esta acción no tiene reversa.'];
      if (wiz.confirm < 2){ $('#d-conf-msg', main).textContent = msgs[wiz.confirm]; conf.textContent = wiz.confirm === 0 ? 'Sí, estoy seguro' : 'Sí, completamente seguro'; wiz.confirm++; return; }
      conf.disabled = true;
      const seq = nextSeq(3), turno = turnoActual() + 5 + Math.floor(Math.random() * 6);
      const t = { office: o, round: 3, kind: 'form', status: 'radicado', seq, turno, f01: wiz.f01, f03: true, f27: true, createdAt: now() };
      if (await act(store.set(P.tr(), uid(), t))){ wiz.last = t; wiz.step = 5; update(); } else conf.disabled = false;
    };
    const again = $('#d-again', main); if (again) again.onclick = () => { resetWiz(); update(); };
  }

  function dynamic(main){
    const m = S.main; if (!m) return;
    const fs = $('#d-fs', main); if (fs) fs.disabled = !clock().running;
    const tap = $('#d-tap', main); if (tap) tap.disabled = !clock().running;
    const cnt = $('#d-count', main); if (cnt) cnt.textContent = S.tramites.filter(t => t.office === o && t.round === 1).length;
    const rn = $('#rad-next', main); if (rn) rn.textContent = radLabel({ round: m.round, office: o, seq: nextSeq(m.round) });
    const rom = $('#rom-n', main); if (rom) rom.textContent = nextSeq(3);
    const qz = $('#d-quiz', main); if (qz) quizPhone(qz);
  }

  function quizPhone(el){
    const m = S.main, qi = m.quiz.i, Q = QUIZ[qi];
    if (!Q){ el.innerHTML = '<div class="waiting"><h2>Fin del quiz</h2><p>Miren el proyector.</p></div>'; return; }
    const a = S.ans.find(x => x.office === o && x.q === qi);
    const open = m.quiz.openedAt && !m.quiz.reveal && now() - m.quiz.openedAt < QUIZ_MS;
    let body;
    if (!m.quiz.openedAt) body = '<p class="muted">Espere a que el moderador abra la pregunta.</p>';
    else if (m.quiz.reveal){ const ok = a && a.opt === Q.ok; body = `<div class="errs" style="border-color:${ok ? 'var(--ok)' : 'var(--stamp)'}; background:${ok ? 'var(--ok-soft)' : 'var(--stamp-soft)'}"><b style="color:${ok ? 'var(--ok)' : 'var(--stamp)'}">${a ? (ok ? '¡Correcto! +' + (10 + bonus(a.ms)) + ' puntos' : 'Incorrecto') : 'Sin respuesta'}</b><div>Respuesta: ${'ABCD'[Q.ok]}. ${esc(Q.o[Q.ok])}</div></div>`; }
    else if (a) body = `<p>Respuesta registrada: <b class="mono">${'ABCD'[a.opt]}</b>. Esperen la revelación en el proyector.</p>`;
    else if (!open) body = '<p class="muted">Se acabó el tiempo para esta pregunta.</p>';
    else body = `<div class="stack">${Q.o.map((t, i) => `<button class="btn big" type="button" data-opt="${i}" style="justify-content:flex-start; text-align:left"><b class="mono">${'ABCD'[i]}</b> ${esc(t)}</button>`).join('')}</div>`;
    const sig = [qi, m.quiz.openedAt, m.quiz.reveal, a ? a.opt : '', open].join('|');
    if (el.dataset.sig === sig) return; el.dataset.sig = sig;
    el.innerHTML = `<span class="label">Pregunta ${qi + 1} de ${QUIZ.length}</span><h3 style="margin:6px 0 12px; font-size:24px">${esc(Q.q)}</h3>${body}<p class="muted" style="font-size:12px; margin-top:10px">Discutan en oficina y responda solo el Director. Correcta: 10 pts + hasta 5 por rapidez.</p>`;
    $$('[data-opt]', el).forEach(b => b.onclick = () => { const m2 = S.main; if (!m2.quiz.openedAt || m2.quiz.reveal || now() - m2.quiz.openedAt >= QUIZ_MS) return;
      $$('[data-opt]', el).forEach(x => x.disabled = true);
      act(store.set(P.ans(), `${qi}_${o}`, { office: o, q: qi, opt: Number(b.dataset.opt), ms: now() - m2.quiz.openedAt, at: now() })); });
  }

  function lists(){
    const m = S.main, dq = $('#d-dirq', root), dl = $('#d-list', root);
    if (!m || ![2,3].includes(m.round)){ dq.innerHTML = ''; dl.innerHTML = ''; return; }
    if (m.round === 3){
      const q = S.tramites.filter(t => t.office === o && t.round === 3 && t.status === 'visto_bueno');
      dq.innerHTML = q.length ? `<div class="sect-title">Pendientes de visto bueno de Dirección</div><div class="tlist">${q.map(t => `<div class="titem"><span class="rad">${esc(radLabel(t))}</span><span class="mono">${esc(t.f01.numero)}</span><div class="meta">${esc(t.f01.titular)} · ya tiene visto bueno del Jefe</div>
        <div style="grid-column:1/-1">${pendingDir === t.id ? `<div class="confirm-row"><span>¿Confirma el visto bueno de Dirección?</span><button class="btn ok sm" data-dirok="${t.id}" type="button">Confirmar</button><button class="btn sm" data-dirno type="button">Volver</button></div>` : `<button class="btn primary sm" data-dir="${t.id}" type="button">Dar visto bueno de Dirección</button>`}</div></div>`).join('')}</div>` : '';
      $$('[data-dir]', dq).forEach(b => b.onclick = () => { pendingDir = b.dataset.dir; lists(); });
      $$('[data-dirno]', dq).forEach(b => b.onclick = () => { pendingDir = null; lists(); });
      $$('[data-dirok]', dq).forEach(b => b.onclick = async () => { b.disabled = true; pendingDir = null; await act(store.update(P.tr(), b.dataset.dirok, { status: 'visto_direccion', dirAt: now() }), 'Visto bueno de Dirección registrado.'); });
    } else dq.innerHTML = '';
    const ts = mine(m.round).sort((a, b) => b.createdAt - a.createdAt);
    const ta = turnoActual();
    dl.innerHTML = `<div class="sect-title">Mis trámites de este nivel</div>` + (ts.length ? `<div class="tlist">${ts.map(t => `<div class="titem"><span class="rad">${esc(radLabel(t))}</span>${statusChip(t)}<div class="meta">${esc(t.f01.titular)} · ${esc(t.f01.numero)}${t.status === 'radicado' && m.round === 3 ? ` · turno ${t.turno}, vamos en el ${ta}` : ''}${t.causal ? ' · Causal: ' + esc(t.causal) : ''}</div></div>`).join('')}</div>` : '<p class="muted">Todavía no ha radicado trámites en este nivel.</p>');
  }

  let lastTurno = 0;
  function update(){
    const main = $('#d-main', root);
    if (!S.main){ $('#d-head', root).innerHTML = ''; noGame(main); main.dataset.key = ''; return; }
    phoneHead($('#d-head', root), o, 'Director');
    circularBanner($('#d-banner', root));
    $('#d-secret', root).innerHTML = S.main.round === 3 ? `<div class="secret"><span class="label">Regla secreta de su oficina</span><p>${esc(SECRETS[o])}</p></div>` : '';
    const k = stageKey();
    if (main.dataset.key !== k){ main.dataset.key = k; main.innerHTML = stageHTML(); bindStage(main); }
    dynamic(main); lists();
  }
  return { update, tick(){
    const main = $('#d-main', root); dynamic(main);
    if (S.main && S.main.round === 3){ const t = turnoActual(); if (t !== lastTurno){ lastTurno = t; lists(); } }
  } };
};

/* ================= JEFE DE ÁREA ================= */
VIEWS.jefe = root => {
  const o = role.office ?? 0;
  root.innerHTML = `<div class="phone" style="--oc:${oColor(o)}"><div id="j-head"></div><div id="j-banner"></div><div id="j-secret"></div><div id="j-main"></div></div>`;
  let lastKey = '', lastTurno = 0;
  function card(t){
    const r3 = t.round === 3, causales = r3 ? CAUSALES3 : CAUSALES;
    return `<article class="formato"><div class="formato-head"><span class="code">F-02</span><div><b>Visto bueno del Jefe de área</b><small class="mono">${esc(radLabel(t))}</small></div></div>

    const done = S.tramites.filter(t => t.office === o && t.round === r && t.jefeAt).sort((a, b) => b.jefeAt - a.jefeAt).slice(0, 6);
    $('#j-hist', main).innerHTML = done.length ? `<div class="sect-title">Decisiones recientes</div><div class="tlist">${done.map(t => `<div class="titem"><span class="rad">${esc(radLabel(t))}</span>${statusChip(t)}<div class="meta">${esc(t.f01.titular)}${t.causal ? ' · ' + esc(t.causal) : ''}</div></div>`).join('')}</div>` : '';
    $$('.j-fs', main).forEach(f => f.disabled = !clock().running);
  }
  return { update, tick(){ if (S.main && S.main.round === 3){ const t = turnoActual(); if (t !== lastTurno){ lastTurno = t; update(); } } if (S.main) $$('.j-fs', root).forEach(f => f.disabled = !clock().running); } };
};

      const glab = ['Nivel 1 · Sin burocracia', 'Nivel 2 · Weber', 'Nivel 3 · Extrema'], gsub = ['pasaportes entregados', 'pasaportes aprobados', 'pasaportes aprobados'];
      let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pasaportes por oficina en cada nivel">`;
      for (let i = 0; i <= 4; i++){ const y = pt + ih * (1 - i / 4); s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="tick" x="${pl - 8}" y="${y + 5}" text-anchor="end">${+(max * i / 4).toFixed(1)}</text>`; }
      s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}"/>`;
      vals.forEach((row, gi) => { const gx = pl + gw * gi + (gw - (5 * bw + 4 * gap)) / 2;
        row.forEach((val, oi) => { const h = ih * val / max, x = gx + oi * (bw + gap), y = pt + ih - h, d = (gi * 1.1 + oi * .12).toFixed(2) + 's';
          s += `<g class="bar" style="--d:${d}"><title>${esc(oName(oi, A.m))} · ${glab[gi]}: ${val}</title><path d="${topBar(x, y, bw, h, 4)}" fill="var(--o${oi + 1})"/><text class="val" x="${x + bw / 2}" y="${y - 8}" text-anchor="middle" style="--d:${d}">${val}</text><text class="otag" x="${x + bw / 2}" y="${pt + ih + 18}" text-anchor="middle">O${oi + 1}</text></g>`; });
        s += `<text class="glabel" x="${pl + gw * gi + gw / 2}" y="${H - 30}" text-anchor="middle">${glab[gi]}</text><text class="gsub" x="${pl + gw * gi + gw / 2}" y="${H - 10}" text-anchor="middle">${T(gi + 1)} ${gsub[gi]}</text>`; });
      s += '</svg>';
      const qcLine = A.qcGiven ? ` En el control de calidad, solo ${A.rows.reduce((a, x) => a + x.r[1].valid, 0)} de los ${T(1)} pasaportes del nivel 1 cumplían el formato.` : '';
      sc.innerHTML = `<span class="kicker">1 · Producción por nivel</span><h2>${T(1)} sin control, ${T(2)} con reglas, ${T(3)} con exceso de reglas</h2>
        <div class="legend">${[0,1,2,3,4].map(o => `<span><span class="swatch" style="background:${oColor(o)}"></span>O${o + 1} · ${esc(oName(o, A.m))}</span>`).join('')}</div>${s}<p class="lead">El caos produce cantidad; la burocracia de Weber produce orden y calidad; el exceso de reglas casi no produce nada.${qcLine}</p>`;
    },
    paper(sc, A){
      const F = r => A.rows.reduce((a, x) => a + x.r[r].forms, 0), V = r => A.rows.reduce((a, x) => a + x.r[r].valid, 0);
      const maxF = Math.max(1, F(1), F(2), F(3)), maxV = Math.max(1, V(1), V(2), V(3));
      const totF = F(1) + F(2) + F(3), qMin = A.rows.reduce((a, x) => a + x.r[3].queueMs, 0) / 60000, bad = A.rows.reduce((a, x) => a + x.r[2].bad + x.r[3].bad, 0);
      const lbl = ['Nivel 1', 'Nivel 2', 'Nivel 3'];
      sc.innerHTML = `<span class="kicker">2 · Papeleo contra resultados</span><h2>Más formularios, menos pasaportes</h2>
        <div class="pv">${[1,2,3].map((r, ci) => { const ns = Math.round(F(r) / maxF * 26), np = Math.round(V(r) / maxV * 20);
          return `<div class="pv-col"><div class="pv-stacks"><div class="tower" aria-hidden="true">${Array.from({ length: ns }, (_, i) => `<div class="sheet" style="bottom:${i * 9}px; transform:rotate(${((i * 37) % 7) - 3}deg); animation-delay:${(ci * 1.6 + i * .06).toFixed(2)}s"></div>`).join('')}</div>
            <div class="pile" aria-hidden="true">${Array.from({ length: np }, (_, i) => `<div class="pass" style="animation-delay:${(ci * 1.6 + .4 + i * .05).toFixed(2)}s"></div>`).join('')}</div></div>
            <div class="pv-nums"><span>Formularios <b data-cu="${F(r)}" data-dl="${ci * 1600}">0</b></span><span>Pasaportes válidos <b data-cu="${V(r)}" data-dl="${ci * 1600 + 400}">0</b></span></div><div class="pv-label">${lbl[ci]}</div></div>`; }).join('')}</div>
        <div class="tiles"><div class="tile"><b data-cu="${totF}" data-dl="5200">0</b><span>formularios llenados en total</span></div><div class="tile"><b data-cu="${qMin.toFixed(1)}" data-dec="1" data-dl="5600">0</b><span>minutos de trámites esperando en cola en el nivel 3</span></div><div class="tile"><b data-cu="${bad}" data-dl="6000">0</b><span>trámites devueltos, rechazados o anulados</span></div></div>`;
      $$('[data-cu]', sc).forEach(b => cleanups.push(countUp(b, Number(b.dataset.cu), 1400, Number(b.dataset.dl || 0), Number(b.dataset.dec || 0))));
    },
    curve(sc, A){
      const mins = r => durOf(A.m, r) / 60000, V = r => A.rows.reduce((a, x) => a + x.r[r].valid, 0);
      const eff = [1,2,3].map(r => V(r) / Math.max(.1, mins(r)));
      const fpp = [2,3].map(r => { const f = A.rows.reduce((a, x) => a + x.r[r].forms, 0), v = V(r); return v ? f / v : null; });
      const W = 1000, H = 400, pl = 54, pr = 40, pt = 60, pb = 70, ih = H - pt - pb, max = niceMax(Math.max(.5, ...eff) * 1.1);
      const xs = [0,1,2].map(i => pl + 90 + i * ((W - pl - pr - 180) / 2)), ys = eff.map(v => pt + ih * (1 - v / max));
      const path = `M${xs[0]},${ys[0]} C${xs[0] + 140},${ys[0]} ${xs[1] - 140},${ys[1]} ${xs[1]},${ys[1]} S${xs[2] - 140},${ys[2]} ${xs[2]},${ys[2]}`;
      const ann = [['Caos', A.qcGiven ? 'Mucho, pero sin control' : 'Mucho, sin control de calidad'], ['Weber', 'Orden, reglas y calidad'], ['Exceso', 'Las reglas se comen el objetivo']];
      let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pasaportes válidos por minuto en cada nivel">`;
      for (let i = 0; i <= 4; i++){ const y = pt + ih * (1 - i / 4); s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="tick" x="${pl - 8}" y="${y + 5}" text-anchor="end">${(max * i / 4).toFixed(1).replace('.', ',')}</text>`; }
      s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}"/><path class="line" d="${path}" style="--len:2200"/>`;
      xs.forEach((x, i) => { const dl = (.4 + i * 1).toFixed(1) + 's'; s += `<g><title>Nivel ${i + 1}: ${eff[i].toFixed(2)} pasaportes válidos por minuto</title><circle class="pt" cx="${x}" cy="${ys[i]}" r="9" style="animation-delay:${dl}"/><text class="ptv" x="${x}" y="${ys[i] - 20}" text-anchor="middle" style="animation-delay:${dl}">${eff[i].toFixed(1).replace('.', ',')}</text>
        <text class="annb" x="${x}" y="${H - 38}" text-anchor="middle" style="animation-delay:${dl}">Nivel ${i + 1} · ${ann[i][0]}</text><text class="ann" x="${x}" y="${H - 16}" text-anchor="middle" style="animation-delay:${dl}">${ann[i][1]}</text></g>`; });
      s += '</svg>';
      sc.innerHTML = `<span class="kicker">3 · La curva de la burocracia</span><h2>Pasaportes válidos por minuto</h2>${s}
        <div class="tiles"><div class="tile"><b>${fpp[0] != null ? fpp[0].toFixed(1).replace('.', ',') : '—'}</b><span>formularios por pasaporte aprobado en el nivel 2</span></div><div class="tile"><b>${fpp[1] != null ? fpp[1].toFixed(1).replace('.', ',') : '—'}</b><span>formularios por pasaporte aprobado en el nivel 3</span></div><div class="tile"><b>${eff[2] < eff[1] ? '−' + Math.round((1 - eff[2] / Math.max(eff[1], .001)) * 100) + '%' : '—'}</b><span>caída de eficiencia del nivel 2 al nivel 3</span></div></div>`;
    },
    wm(sc){
      sc.innerHTML = `<span class="kicker">4 · Lo que vivieron</span><h2>La burocracia ideal y sus disfunciones</h2><div class="wm">
        <div class="wm-col"><h3>Lo que Weber propuso</h3><span class="who">Max Weber · características del modelo burocrático</span>${WEBER.map((w, i) => `<div class="wm-item" style="animation-delay:${(.3 + i * .45).toFixed(2)}s">${esc(w[0])}<small>${esc(w[1])}</small></div>`).join('')}</div>
        <div class="wm-col merton"><h3>Lo que Merton advirtió</h3><span class="who">Robert K. Merton · disfunciones de la burocracia</span>${MERTON.map((w, i) => `<div class="wm-item" style="animation-delay:${(3.8 + i * .45).toFixed(2)}s">${esc(w[0])}<small>${esc(w[1])}</small></div>`).join('')}</div></div>`;
    },
    podium(sc, A){
      const rows = [...A.rows].sort((a, b) => b.pts - a.pts || a.o - b.o), top = rows.slice(0, 3), rest = rows.slice(3);
      const maxP = Math.max(1, ...top.map(x => x.pts));
      const order = [top[1], top[0], top[2]], place = [2, 1, 3], delays = [1.2, 2.2, .3];
      sc.innerHTML = `<span class="kicker">5 · Resultado oficial</span><h2>Oficina ganadora: ${esc(oName(top[0].o, A.m))}</h2>
        <div class="podium">${order.map((x, i) => x ? `<div class="pod"><div class="nm">${esc(oName(x.o, A.m))}</div><div class="blk" style="--oc:${oColor(x.o)}; height:${Math.max(26, (x.pts / maxP) * 100 * (place[i] === 1 ? 1 : .86))}%; animation-delay:${delays[i]}s"><b>${place[i]}</b><span>${x.pts} pts</span></div></div>` : '<div></div>').join('')}</div>
        ${rest.length ? `<div class="rest">${rest.map((x, i) => `<span style="--oc:${oColor(x.o)}">${i + 4}. ${esc(oName(x.o, A.m))} · ${x.pts} pts</span>`).join('')}</div>` : ''}
        ${A.m && A.m.burocrata ? `<div class="bda"><span class="label">Premio especial</span><b>Burócrata del año</b>${esc(A.m.burocrata)}</div>` : ''}`;
      const t = setTimeout(() => { Sound.fanfare(); cleanups.push(confetti(host)); }, 2900); cleanups.push(() => clearTimeout(t));
    },
  };
  $('[data-prev]', host).onclick = () => show(idx - 1);
  $('[data-next]', host).onclick = () => show(idx + 1);
  $('[data-pause]', host).onclick = e => { paused = !paused; e.target.textContent = paused ? 'Reanudar' : 'Pausar'; clearTimeout(timer); if (!paused && SCENES[idx].dur) timer = setTimeout(() => show(idx + 1), SCENES[idx].dur * 1000); };
  const close = $('[data-close]', host); if (close) close.onclick = () => { api.destroy(); opts.onClose && opts.onClose(); };
  const onKey = e => { if (e.target.closest && e.target.closest('input,textarea,select')) return; if (e.key === 'ArrowRight') show(idx + 1); else if (e.key === 'ArrowLeft') show(idx - 1); else if (e.key === 'Escape' && opts.fixed){ api.destroy(); opts.onClose && opts.onClose(); } };
  document.addEventListener('keydown', onKey);
  const api = { destroy(){ clean(); clearTimeout(timer); document.removeEventListener('keydown', onKey); if (opts.fixed) host.remove(); else host.innerHTML = ''; } };
  show(0);
  return api;
}

/* datos de ejemplo para ensayar el informe (no se guardan) */
function sampleData(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const t0 = now() - 40 * 60000, tramites = [], pen = [], ans = [];
  const r1 = [15, 12, 17, 10, 13], r2 = [7, 6, 8, 5, 6], r3 = [1, 0, 2, 0, 1];
  for (let o = 0; o < 5; o++){
    for (let i = 0; i < r1[o]; i++) tramites.push({ office: o, round: 1, kind: 'tap', status: 'aprobado', createdAt: t0 });
    for (let i = 0; i < r2[o] + 2; i++){ const c = t0 + 6 * 60000 + i * 50000; const ok = i < r2[o]; tramites.push({ office: o, round: 2, kind: 'form', status: ok ? 'aprobado' : 'devuelto', jefeAt: c + 30000, createdAt: c, doneAt: c + (ok ? 70000 : 30000) }); }
    for (let i = 0; i < r3[o] + 3; i++){ const c = t0 + 15 * 60000 + i * 40000; const ok = i < r3[o]; tramites.push({ office: o, round: 3, kind: 'form', status: ok ? 'aprobado' : (i % 2 ? 'anulado' : 'radicado'), jefeAt: ok ? c + 90000 : 0, dirAt: ok ? c + 110000 : 0, createdAt: c, doneAt: ok ? c + 140000 : (i % 2 ? c + 80000 : 0) }); }
    for (let i = 0; i < [2, 4, 1, 3, 2][o]; i++) pen.push({ office: o, type: Object.keys(PEN)[i % 4], round: 2, at: t0 });
    QUIZ.forEach((Q, q) => { if (rnd() < .75) ans.push({ office: o, q, opt: rnd() < .78 ? Q.ok : (Q.ok + 1) % 4, ms: 3000 + rnd() * 15000 }); });
  }
  const main = { names: names(), qc: [3, 2, 4, 2, 3], burocrata: S.main && S.main.burocrata ? S.main.burocrata : 'Archivista de la Secretaría de Asuntos Pendientes', durs: {}, roundEndAt: { 1: t0 + 5 * 60000, 2: t0 + 14 * 60000, 3: t0 + 20 * 60000 } };
  return { main, tramites, pen, ans, aj: [] };
}
